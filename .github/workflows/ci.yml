name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apps Script logic
        run: node --test tests/apps-script.test.mjs

      - name: PWA tests and build
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
